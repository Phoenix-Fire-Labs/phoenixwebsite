name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: NEXT_PUBLIC_JSONLD_HASH=$(node scripts/jsonld-hash.mjs) yarn build
      - run: rm -f tsconfig.tsbuildinfo && trace verify --changed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-build
          path: .next
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: npx playwright install chromium --with-deps
      - run: NEXT_PUBLIC_JSONLD_HASH=$(node scripts/jsonld-hash.mjs) yarn build
      - run: PLAYWRIGHT_BROWSERS_PATH=~/.cache/ms-playwright yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
