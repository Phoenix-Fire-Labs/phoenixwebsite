name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before setup-node: package.json pins "packageManager": "yarn@4.18.0",
      # and setup-node's `cache: yarn` shells out to the global yarn (1.22) to
      # find the cache directory, which refuses to run without Corepack.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: NEXT_PUBLIC_JSONLD_HASH=$(node scripts/jsonld-hash.mjs) yarn build

      # `trace` is a Python tool, not a dev dependency, so it has to be
      # installed explicitly. Pinned to the version the markers were authored
      # against; an unpinned install would let a new release change the gate.
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install tracelayer==0.9.1
      - run: rm -f tsconfig.tsbuildinfo && trace verify --changed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-build
          path: .next
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: npx playwright install chromium --with-deps

      # No build step here: playwright.config.ts runs `yarn build && yarn start`
      # in its webServer, so building again would double the job time and risk
      # testing a different artifact than the one the suite serves.
      - run: PLAYWRIGHT_BROWSERS_PATH=~/.cache/ms-playwright yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
