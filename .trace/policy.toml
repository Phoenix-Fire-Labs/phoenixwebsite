# TraceLayer policy (spec Section 24.4).
profile = "standard"

[lifecycle]
default = "wip"
ci = "merge"

[requirements.merge]
require_work_ancestry = true
require_requirement_for_changed_behavior = true
require_verifying_test = true
require_test_pass = true
require_coverage_confirmation = false
block_stale = true

[requirements.release]
require_coverage_confirmation = true
require_semantic_audit = true

[exclusions]
paths = [
  "vendor/**",
  "**/vendor/**",
  "generated/**",
  "**/generated/**",
  "**/node_modules/**",
  "docs/vendor/**",
  ".trace/**",
  ".bugcorpus/**",
  ".DS_Store",
  "**/.DS_Store",
  "**/__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".gitignore",
  "AGENTS.md",
  "CLAUDE.md",
  ".mcp.json",
  "junit.xml",
  "coverage.xml",
  ".agents/**",
  ".claude/**",
  ".codex/**",
  ".pi/**",
  ".omp/**",
  ".hermes/**",
  ".serena/**",
  ".scc/**",
  "opencode.json",
  "tests/**",
  ".agents/skills/**",
  ".claude/skills/**",
  ".pi/skills/**",
  ".omp/skills/**",
  ".hermes/skills/**",
  "*_test.*",
  "*.test.*",
  "*_spec.*",
  "*.spec.*",
  ".oxlintrc.json",
  "tools",
  "tools/**",
  "next-env.d.ts",
  "postcss.config.mjs",
  "vitest.config.ts",
  ".yarnrc.yml",
  ".env.example",
  "src/app/globals.css",
  "archive-static-golden-master",
  "archive-static-golden-master/**",
  "README.md",
  "DESIGN.md",
  "public",
  "public/**",
  ".next",
  ".next/**",
  "docs/launch-runbook.md",
  "github/workflows/ci.yml",
  "github/dependabot.yml",
  "playwright.config.ts",
  "bughunt",
  "bughunt/**",
  "bughunt.toml",
  ".pyre_configuration",
  ".github/**",
  ".archive-static-golden-master/**",
]
extensions = [

]
